# Self-contained development stack — SQLite only, no Postgres.
# Use this when you want a one-command spin-up for trying Cardscape
# without external dependencies.
#
#     docker compose -f docker-compose.dev.yml up -d
#
# Then open http://localhost:8080.

services:
  cardscape.api:
    build:
      context: .
      dockerfile: src/Cardscape.Api/Dockerfile
    image: cardscape/api:0.1.0-mvp
    container_name: cardscape.api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Database__Provider: Sqlite
      ConnectionStrings__Default: Data Source=/app/Data/cardscape.db
      Storage__LocalRoot: /app/Storage
      Jwt__SigningKey: ${CARDS_CAPE_JWT_KEY:-dev-only-insecure-signing-key-please-override-in-production-32+chars}
      Jwt__Issuer: Cardscape
      Jwt__Audience: Cardscape
      Cors__AllowedOrigins__0: http://localhost:8080
      Cors__AllowedOrigins__1: http://127.0.0.1:8080
    ports:
      - "8080:8080"
    volumes:
      - cardscape.data:/app/Data
      - cardscape.uploads:/app/Storage
    healthcheck:
      # BETA-8-ENV-#1 — see test-results/r8/r8-report.md.
      # The previous `dotnet Cardscape.Api.dll --health` command spawned
      # a SECOND Kestrel instance on :8080 (address-in-use, exit 134),
      # which made the container report unhealthy forever even though
      # the primary API answered 200 on /health. Probe the live endpoint
      # with curl instead; curl is installed in the Dockerfile runtime
      # stage specifically for this.
      test: ["CMD-SHELL", "curl --silent --fail --max-time 4 http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  cardscape.data:
  cardscape.uploads:
