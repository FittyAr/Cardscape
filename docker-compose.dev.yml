# Development stack with PostgreSQL.
#
#     docker compose -f docker-compose.dev.yml up -d
#
# Then open http://localhost:7420.

services:
  postgres:
    image: postgres:17-alpine
    container_name: cardscape.postgres.dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: cardscape
      POSTGRES_USER: cardscape
      POSTGRES_PASSWORD: ${CARDS_CAPE_DB_PASSWORD:-cardscape}
    volumes:
      - cardscape.dev.postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cardscape -d cardscape"]
      interval: 5s
      timeout: 5s
      retries: 20

  cardscape.api:
    build:
      context: .
      dockerfile: src/Cardscape.Api/Dockerfile
    image: cardscape/api:0.1.0-mvp
    container_name: cardscape.api
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Database__Provider: PostgreSQL
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=cardscape;Username=cardscape;Password=${CARDS_CAPE_DB_PASSWORD:-cardscape}
      Storage__LocalRoot: /app/Storage
      Cardscape__DataProtection__KeyDirectory: /app/DataProtectionKeys
      Jwt__SigningKey: ${CARDS_CAPE_JWT_KEY:-dev-only-insecure-signing-key-please-override-in-production-32+chars}
      Jwt__Issuer: Cardscape
      Jwt__Audience: Cardscape
      Cors__AllowedOrigins__0: http://localhost:7420
      Cors__AllowedOrigins__1: http://127.0.0.1:7420
      Cors__AllowedOrigins__2: https://cardscape.home.fitty.ar
      Cardscape__Database__RunMigrationsOnStartup: "true"
      Cardscape__Seeder__Enabled: "false"
      Cardscape__Seeder__WipeBeforeSeed: "false"
    ports:
      - "${CARDSCAPE_PORT:-7420}:8080"
    volumes:
      - cardscape.data:/app/Data
      - cardscape.uploads:/app/Storage
      - cardscape.keys:/app/DataProtectionKeys
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --fail --max-time 4 http://localhost:8080/health/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  cardscape.data:
  cardscape.uploads:
  cardscape.keys:
  cardscape.dev.postgres_data:

