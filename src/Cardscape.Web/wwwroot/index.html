<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f766e" />
    <title>Cardscape</title>
    <base href="/" />
    <link rel="stylesheet" href="css/barlow.css" />
    <!--
        Boot splash theming: runs before the first paint and paints
        the splash with the user's saved theme (CardscapeTheme cookie)
        so a cold load never flashes a white page. Must stay a
        blocking script ahead of the stylesheets.
    -->
    <script src="boot-splash.js"></script>
    <!--
        BETA-9-#6 — see test-results/r9/r9-report.md. wwwroot/css/app.css
        carries the `display: none` rule for #blazor-error-ui plus the
        boot splash (#cs-boot) styling. Without this <link>, the
        framework's red error banner is visible on every page load.
    -->
    <link rel="stylesheet" href="css/app.css" />
    <!-- Bundle of every component-scoped *.razor.css file. Without
         this link none of the isolated styles (KanbanBoard, Home,
         EmptyLayout, PageHeader, …) reach the page. -->
    <link rel="stylesheet" href="Cardscape.Web.styles.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <script src="_content/Radzen.Blazor/Radzen.Blazor.js"></script>
    <script src="cardscape-helpers.js"></script>
</head>

<body>
    <!--
        Boot splash: sits above #app until App.razor reports that the
        first render and the theme stylesheet are in place
        (cardscape.bootComplete in boot-splash.js), then fades out.
        The glyph matches Shared/LoadingState.razor so the hand-off
        to a page-level loader reads as one continuous screen.
    -->
    <div id="cs-boot" class="cs-boot" role="status" aria-live="polite" aria-busy="true" aria-label="Loading Cardscape…">
        <div class="cs-boot-content">
            <svg class="cs-boot-glyph" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <rect class="cs-boot-card cs-boot-card-back" x="9" y="2" width="12" height="15" rx="2.5" />
                <rect class="cs-boot-card cs-boot-card-middle" x="6" y="4.5" width="12" height="15" rx="2.5" />
                <rect class="cs-boot-card cs-boot-card-front" x="3" y="7" width="12" height="15" rx="2.5" />
            </svg>
            <div class="cs-boot-track" aria-hidden="true">
                <div class="cs-boot-progress"></div>
            </div>
        </div>
    </div>

    <div id="app"></div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>
    <!--
        BETA-SW-006 — see test-results/beta/round-2/sw-caching.md.
        The service worker registration is intentionally
        disabled. Two rounds of SW work (network-first,
        stale-while-revalidate) were tried and both produced
        a visible mismatch between the first load and a
        hard reload: the SW either served stale assets
        (round 1 cache-first) or added a network round-trip
        that left the loading spinner on a white background
        for too long (round 2 variants). The cleanest fix
        for the kanban use case — teams that want to log
        in and get to their boards quickly — is to skip the
        SW entirely. The browser's HTTP cache already gives
        us most of the perf wins (assets are content-hashed
        in the Blazor boot.json), and a future PWA round
        can bring the SW back with a battle-tested wrapper
        (Workbox, VitePWA, etc.) that handles the install
        / activate / revalidate dance correctly.

        Previously this block was a Razor @*…*@ comment
        (carried over from the .razor comment style in
        App.razor and MainLayout.razor). In a static
        .html file the Razor parser is NOT invoked, so
        @* and *@ are literal text and the browser was
        rendering the whole rationale as a paragraph at
        the top of the <body>. The comment is now a real
        HTML comment so the page ships clean markup.
    -->
    <script>
        // BETA-SW-006 — see test-results/beta/round-2/sw-caching.md.
        // Unregister any pre-existing service worker left over
        // from an earlier deploy. Without this, the user keeps
        // seeing the old behaviour (cached assets, old
        // loading flow) until they manually clear site data.
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations()
                .then((regs) => regs.forEach((r) => r.unregister()))
                .catch(() => { /* best effort */ });
        }
    </script>
</body>

</html>
