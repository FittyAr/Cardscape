<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cardscape.Web</title>
    <base href="/" />
    <link rel="modulepreload" href="_framework/dotnet.js" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#1d4ed8" />
    <link href="Cardscape.Web.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <!--
        .NET 11 preview SDK (11.0.100-preview.6.26359.118) does not run
        the token-replacement pass on the <link id="webassembly" /> /
        <script src="_framework/blazor.webassembly#[.{fingerprint}].js">
        placeholders. They were originally hardcoded to non-fingerprinted
        names, which worked while the build step was stripping the
        fingerprints from the framework files. Once we stopped stripping
        the fingerprints (the boot manifest in dotnet.js expects the
        fingerprinted names), the non-fingerprinted preload became a
        404. The runtime does not depend on the preload — it reads the
        boot manifest from _framework/dotnet.js and fetches the
        fingerprinted names itself. So we drop the preload entirely
        (the runtime already preloads what it needs) and keep the
        fingerprinted files served as-is by the API.
    -->
    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        // Register the PWA service worker. Done as the
        // last script so the Blazor boot is not blocked
        // by the registration handshake.
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker
                    .register('service-worker.js')
                    .catch((err) => console.warn('Service worker registration failed:', err));
            });
        }
    </script>
</body>

</html>
