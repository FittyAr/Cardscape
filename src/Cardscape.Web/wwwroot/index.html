<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cardscape</title>
    <base href="/" />
    <link rel="stylesheet" href="css/barlow.css" />
    <!--
        BETA-9-#6 — see test-results/r9/r9-report.md. wwwroot/css/app.css
        carries the `display: none` rule for #blazor-error-ui plus the
        .loading-progress spinner styling. Without this <link>, the
        framework's red error banner is visible on every page load
        (the default <div> `display: block` wins because the override
        never reaches the cascade) and the WASM boot spinner renders
        without its rotation animation. The file was orphaned when
        the Radzen migration dropped the per-page `cs-*` rules in
        favour of Radzen primitives, but the framework's two template
        elements still need the styles.
    -->
    <link rel="stylesheet" href="css/app.css" />
    <!--
        v1.2.0 theming (docs/roadmap/06-plan-radzen-themes.md commit 3):
        the two static Radzen CSS <link> tags that used to live here
        are gone. The <RadzenTheme> component in App.razor emits the
        matching <link> at runtime based on the user's choice —
        Radzen.ThemeService (via the cookie service) resolves the
        10 free themes (default, humanistic, material, software,
        standard, and their -dark siblings) to the matching
        _content/Radzen.Blazor/css/{name}.css file, and
        UserPreferencesService binds the Radzen.Theme POCO for the
        two Cardscape Classic custom themes (which override the
        --rz-* CSS variables inline).
    -->
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#0f3d3e" />
    <script src="_content/Radzen.Blazor/Radzen.Blazor.js?v=@(typeof(Radzen.Colors).Assembly.GetName().Version)"></script>
    <script src="cardscape-helpers.js"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        // Register the PWA service worker. Done as the last
        // script so the Blazor boot is not blocked by the
        // registration handshake.
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker
                    .register('service-worker.js')
                    .catch((err) => console.warn('Service worker registration failed:', err));
            });
        }
    </script>
</body>

</html>
