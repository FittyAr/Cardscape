# Production-mirror of the dev stack — same image, but
# `ASPNETCORE_ENVIRONMENT=Production` and a separate port / volume
# set so you can run BOTH side by side and compare the
# loading-screen behaviour (the JIT-vs-precompiled race that
# started the SW saga).
#
# Dev (hot reload, slow first load):
#     docker compose -f docker-compose.dev.yml up -d
#     -> http://localhost:7420
#
# Prod (pre-compiled WASM, fast first load):
#     docker compose -f docker-compose.prod.yml up -d
#     -> http://localhost:7421
#
# Both compose files use the same `cardscape/api:0.1.0-mvp`
# image. The only thing that changes is the env override on the
# container, which flips the .NET runtime from "JIT in the
# browser" (Development) to "pre-compiled to .wasm" (Production).
# That single switch collapses the 5-15s blank-page window on
# first load to ~2s, which is the only way to make the
# "first render shows light, then re-renders to dark"
# race in the system-color scheme detection (see BETA-SW-009
# in test-results/beta/round-2/sw-caching.md) stop being
# user-visible.
#
# IMPORTANT: this stack uses the docker compose project name
# `cardscape-prod` (see the top-level `name:` field below).
# Without it, both this and docker-compose.dev.yml resolve to
# the same project name (`cardscape`, the directory name) and
# end up sharing the default network. Sharing the network
# makes `up -d` on one compose file recreate the other
# stack's container, which makes "run both side by side"
# impossible. The `name:` field gives the prod stack its own
# network (`cardscape-prod_default`) and its own volume
# prefix (`cardscape-prod_*`).
#
# Note on the JWT key: the dev compose falls back to a
# hard-coded insecure key when CARDS_CAPE_JWT_KEY is unset.
# This prod compose does NOT — it requires you to provide one
# in a .env file or your shell, matching the self-hostable
# docker-compose.yml convention. Generate with:
#     openssl rand -base64 48
#
# Note on the data volumes: the volumes are named
# `cardscape.prod.data` / `cardscape.prod.uploads` so the prod
# stack does not clobber the dev stack's SQLite / upload
# directories. Both are independent.

# The `name:` at the top level sets the docker compose PROJECT
# NAME (which prefixes networks, volumes, and the implicit
# container name). Setting it to `cardscape-prod` keeps the
# prod stack in its own namespace so it can run side by side
# with the dev stack.
name: cardscape-prod

services:
  postgres:
    image: postgres:17-alpine
    container_name: cardscape.postgres.prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: cardscape
      POSTGRES_USER: cardscape
      POSTGRES_PASSWORD: ${CARDS_CAPE_DB_PASSWORD:-cardscape}
    volumes:
      - cardscape.prod.postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cardscape -d cardscape"]
      interval: 5s
      timeout: 5s
      retries: 20

  cardscape.api:
    build:
      context: .
      dockerfile: src/Cardscape.Api/Dockerfile
    image: cardscape/api:0.1.0-mvp
    container_name: cardscape.api.prod
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Database__Provider: PostgreSQL
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=cardscape;Username=cardscape;Password=${CARDS_CAPE_DB_PASSWORD:-cardscape}
      Storage__LocalRoot: /app/Storage
      Cardscape__DataProtection__KeyDirectory: /app/DataProtectionKeys
      # Production must fail closed when no signing key is supplied.
      # Generate one with `openssl rand -base64 48` and expose it
      # through the shell or a non-versioned .env file.
      Jwt__SigningKey: ${CARDS_CAPE_JWT_KEY:?Set CARDS_CAPE_JWT_KEY in your .env file (openssl rand -base64 48)}
      Jwt__Issuer: Cardscape
      Jwt__Audience: Cardscape
      Cors__AllowedOrigins__0: http://localhost:7421
      Cors__AllowedOrigins__1: http://127.0.0.1:7421
      Cors__AllowedOrigins__2: https://cardscape.home.fitty.ar
      Cardscape__Database__RunMigrationsOnStartup: "true"
    ports:
      - "${CARDSCAPE_PROD_PORT:-7421}:8080"
    volumes:
      - cardscape.prod.data:/app/Data
      - cardscape.prod.uploads:/app/Storage
      - cardscape.prod.keys:/app/DataProtectionKeys
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --fail --max-time 4 http://localhost:8080/health/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  cardscape.prod.data:
  cardscape.prod.uploads:
  cardscape.prod.keys:
  cardscape.prod.postgres_data:

