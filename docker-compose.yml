# Cardscape self-hostable stack.
# - `cardscape.api` — the REST + Blazor-served API. Self-contained: SQLite
#   for the schema + local volume for uploads. `docker compose up` is the
#   only command the operator needs to get a working install.
# - `cardscape.data` + `cardscape.uploads` — named volumes so the SQLite
#   file and uploaded storage survive container restarts.
#
# Bring the whole thing up with:
#     docker compose up -d
# Then open http://localhost:8080 in your browser.

services:
  cardscape.api:
    build:
      context: .
      dockerfile: src/Cardscape.Api/Dockerfile
    image: cardscape/api:0.1.0-mvp
    container_name: cardscape.api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Data Source=/app/Data/cardscape.db
      Storage__LocalRoot: /app/Storage
      # IMPORTANT: override the dev default in production. Generate with
      #   openssl rand -base64 48
      Jwt__SigningKey: ${CARDS_CAPE_JWT_KEY:?Set CARDS_CAPE_JWT_KEY in your .env file (openssl rand -base64 48)}
      Jwt__Issuer: Cardscape
      Jwt__Audience: Cardscape
      Cors__AllowedOrigins__0: http://localhost:8080
      Cors__AllowedOrigins__1: http://127.0.0.1:8080
      # The migration runner defaults to `app.Environment.IsDevelopment()` —
      # i.e. off in Production. The Cardscape self-hostable workflow ships
      # `docker compose up` as the documented entry point, and a fresh
      # database without the schema is a 500-loop from the
      # BackgroundJobDispatcher. Flip the default to true here so the
      # self-hostable workflow actually works. Operators that prefer to
      # run migrations as a separate step (e.g. via `dotnet ef database
      # update` in a CI job) can still set this to false.
      Cardscape__Database__RunMigrationsOnStartup: "true"
    ports:
      - "8080:8080"
    volumes:
      - cardscape.data:/app/Data
      - cardscape.uploads:/app/Storage
    healthcheck:
      # BETA-8-ENV-#1 — see test-results/r8/r8-report.md.
      # The previous `dotnet Cardscape.Api.dll --health` command spawned
      # a SECOND Kestrel instance on :8080 (address-in-use, exit 134),
      # which made the container report unhealthy forever even though
      # the primary API answered 200 on /health. Probe the live endpoint
      # with curl instead; curl is installed in the Dockerfile runtime
      # stage specifically for this.
      test: ["CMD-SHELL", "curl --silent --fail --max-time 4 http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  cardscape.data:
  cardscape.uploads:
