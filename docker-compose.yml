# Cardscape self-hostable stack.
# - `postgres` — PostgreSQL 17 database service on internal Docker network.
# - `cardscape.api` — the REST + Blazor-served API. Connected to PostgreSQL.
# - `cardscape.postgres_data` + `cardscape.uploads` — named volumes so the
#   database and uploaded storage survive container restarts.
#
# Bring the whole thing up with:
#     docker compose up -d
# Then open http://localhost:8080 in your browser.

services:
  postgres:
    image: postgres:17-alpine
    container_name: cardscape.postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cardscape
      POSTGRES_USER: cardscape
      POSTGRES_PASSWORD: ${CARDS_CAPE_DB_PASSWORD:-cardscape}
    volumes:
      - cardscape.postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cardscape -d cardscape"]
      interval: 5s
      timeout: 5s
      retries: 20

  cardscape.api:
    build:
      context: .
      dockerfile: src/Cardscape.Api/Dockerfile
    image: cardscape/api:0.1.0-mvp
    container_name: cardscape.api
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Database__Provider: PostgreSQL
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=cardscape;Username=cardscape;Password=${CARDS_CAPE_DB_PASSWORD:-cardscape}
      Storage__LocalRoot: /app/Storage
      Cardscape__DataProtection__KeyDirectory: /app/DataProtectionKeys
      # IMPORTANT: override the dev default in production. Generate with
      #   openssl rand -base64 48
      Jwt__SigningKey: ${CARDS_CAPE_JWT_KEY:?Set CARDS_CAPE_JWT_KEY in your .env file (openssl rand -base64 48)}
      Jwt__Issuer: Cardscape
      Jwt__Audience: Cardscape
      Cors__AllowedOrigins__0: http://localhost:8080
      Cors__AllowedOrigins__1: http://127.0.0.1:8080
      Cardscape__Database__RunMigrationsOnStartup: "true"
    ports:
      - "8080:8080"
    volumes:
      - cardscape.data:/app/Data
      - cardscape.uploads:/app/Storage
      - cardscape.keys:/app/DataProtectionKeys
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --fail --max-time 4 http://localhost:8080/health/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  cardscape.data:
  cardscape.uploads:
  cardscape.keys:
  cardscape.postgres_data:

