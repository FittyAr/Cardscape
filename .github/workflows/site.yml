name: site

on:
  push:
    branches: [master, main]
    paths:
      - 'site/**'
      - 'docs/status.md'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Publish site + status page
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout master (full history for the merge)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: master
          fetch-depth: 0
          path: master

      - name: Prepare site work tree (bootstrap on first run)
        shell: bash
        working-directory: master
        run: |
          set -euo pipefail
          site_ref="$(git ls-remote --heads origin refs/heads/site)"
          if [ -n "$site_ref" ]; then
            git fetch origin refs/heads/site:refs/remotes/origin/site
            git worktree add --track -b site ../site origin/site
          else
            git worktree add --orphan -b site ../site
          fi

      - name: Sync static site assets (site/) into the work tree
        shell: bash
        run: |
          set -e
          rsync -a --delete --exclude='.git' --exclude='CNAME' master/site/ site/

      - name: Sync status page (docs/status.md -> site/status/index.md)
        shell: bash
        run: |
          set -e
          mkdir -p site/status
          cp master/docs/status.md site/status/index.md

      - name: Commit and push
        shell: bash
        working-directory: site
        run: |
          set -e
          git config user.name  "Cardscape site bot"
          git config user.email "site-bot@cardscape.local"
          git add -A
          if git diff --cached --quiet; then
            echo "No site changes to publish; skipping push."
            exit 0
          fi
          # Include the triggering commit SHA so the
          # site commit references the master commit.
          TRIGGER_SHA="${{ github.event.after }}"
          git commit -m "site: publish from ${TRIGGER_SHA:0:12}"
          git push origin site
          echo "Published site from ${TRIGGER_SHA:0:12}."
